<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <title>Кекс — маскот канала</title>

  <!-- палитра: шерсть #2E2B28 · грудка/мордочка #FAF3E8 · глаза #7FD858 · нос/уши/лапки #E8814A -->

  <ellipse cx="200" cy="414" rx="100" ry="13" fill="#000000" opacity="0.10"/>

  <!-- хвост: один сужающийся к кончику завиток -->
  <path d="M 272 320
           C 316 316, 336 282, 326 244
           C 320 220, 300 214, 296 232
           C 292 250, 306 262, 300 282
           C 296 296, 282 302, 268 298
           Z" fill="#2E2B28"/>

  <!-- тело (сидит) -->
  <path d="M 118 302
           C 118 364, 152 400, 200 400
           C 248 400, 282 364, 282 302
           C 282 262, 248 240, 200 240
           C 152 240, 118 262, 118 302 Z" fill="#2E2B28"/>

  <!-- голова + уши одним силуэтом, без стыков -->
  <path d="M 146 48
           C 128 66, 114 96, 104 138
           C 93 158, 88 198, 94 232
           C 100 268, 140 294, 200 294
           C 260 294, 300 268, 306 232
           C 312 198, 307 158, 296 138
           C 286 96, 272 66, 254 48
           C 240 64, 224 90, 210 108
           C 203 116, 197 116, 190 108
           C 176 90, 160 64, 146 48 Z" fill="#2E2B28"/>

  <!-- внутренняя часть ушей -->
  <path d="M 152 66 C 141 84, 132 106, 126 128 C 138 118, 154 100, 168 84 Z" fill="#E8814A"/>
  <path d="M 248 66 C 259 84, 268 106, 274 128 C 262 118, 246 100, 232 84 Z" fill="#E8814A"/>

  <!-- грудка / мордочка -->
  <path d="M 160 186
           C 158 224, 148 256, 148 298
           C 148 350, 172 384, 200 384
           C 228 384, 252 350, 252 298
           C 252 256, 242 224, 240 186
           C 240 168, 222 156, 200 156
           C 178 156, 160 168, 160 186 Z" fill="#FAF3E8"/>

  <!-- усы -->
  <g stroke="#B9AFA0" stroke-width="2.5" stroke-linecap="round">
    <line x1="150" y1="206" x2="82" y2="194"/>
    <line x1="150" y1="215" x2="78" y2="215"/>
    <line x1="150" y1="224" x2="82" y2="236"/>
    <line x1="250" y1="206" x2="318" y2="194"/>
    <line x1="250" y1="215" x2="322" y2="215"/>
    <line x1="250" y1="224" x2="318" y2="236"/>
  </g>

  <!-- глаза -->
  <circle cx="164" cy="176" r="27" fill="#7FD858"/>
  <circle cx="236" cy="176" r="27" fill="#7FD858"/>
  <circle cx="164" cy="180" r="10" fill="#1A1A1A"/>
  <circle cx="236" cy="180" r="10" fill="#1A1A1A"/>
  <circle cx="157" cy="169" r="4" fill="#FFFFFF"/>
  <circle cx="229" cy="169" r="4" fill="#FFFFFF"/>

  <!-- нос -->
  <path d="M 191 206 L 209 206 L 200 218 Z" fill="#E8814A"/>

  <!-- рот -->
  <path d="M 188 218 Q 200 229 200 218 Q 200 229 212 218"
        fill="none" stroke="#8A7A66" stroke-width="3.5" stroke-linecap="round"/>

  <!-- передние лапки — тёмные "варежки" поверх нижнего края грудки -->
  <path d="M 138 366 C 132 380, 136 398, 155 400 C 174 402, 182 388, 178 372
           C 174 358, 148 356, 138 366 Z" fill="#2E2B28"/>
  <path d="M 262 366 C 268 380, 264 398, 245 400 C 226 402, 218 388, 222 372
           C 226 358, 252 356, 262 366 Z" fill="#2E2B28"/>
  <g fill="#E8814A">
    <ellipse cx="147" cy="378" rx="5" ry="7"/>
    <ellipse cx="160" cy="374" rx="5" ry="7"/>
    <ellipse cx="171" cy="380" rx="5" ry="7"/>
    <ellipse cx="253" cy="378" rx="5" ry="7"/>
    <ellipse cx="240" cy="374" rx="5" ry="7"/>
    <ellipse cx="229" cy="380" rx="5" ry="7"/>
  </g>
</svg>
